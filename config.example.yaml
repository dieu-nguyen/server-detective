# ============================================================================
# Windows Server Multi-Service Telegram Debug Agent — Configuration
# ============================================================================
# Copy or edit this file as `config.yaml` on your Windows Server.
# Secrets (TELEGRAM_BOT_TOKEN, MYSQL_PASSWORD, API keys) are loaded from `.env`.

server_name: "prod-win-server-01"
timezone: "Asia/Saigon"

# ----------------------------------------------------------------------------
# 1. AGENT ENGINE SWITCH, SESSION LIFECYCLE, & CLI RESTRICTIONS
# ----------------------------------------------------------------------------
# Choose between:
#   - "cli_subscription": Uses your flat-rate monthly subscription via official
#                         CLI agent (Cursor CLI default, or Claude / Codex / Gemini).
#   - "sdk_apikey":       Uses an API key (`ANTHROPIC_API_KEY`, `OPENAI_API_KEY`, etc.)
#                         powered by the OpenCode CLI harness (`opencode run --session`)
#                         or Pi CLI (`pi -p`).
engine:
  mode: "cli_subscription"          # "cli_subscription" | "sdk_apikey"
  allow_telegram_mode_switch: true  # Allow admins to run `/mode cli_subscription` or `/mode sdk_apikey`
  auto_fallback_to_sdk: false       # If true, falls back to sdk_apikey when CLI subscription hits quota/timeout
  max_history_messages: 10          # Transcript turns kept for cross-tool session porting
  audit_log_file: "./audit.jsonl"

  # --- SQLite Session Lifecycle & Cross-Tool Porting (`agent_state.db`) ---
  # Stores all sessions, per-tool native IDs (`cursor`, `claude`, `opencode`, `pi`),
  # turn transcripts, pending approvals, and audit logs in a single SQLite DB (`agent_state.db`).
  # Automatically starts a fresh session when any of these conditions occur:
  #   1. The chat has been idle for > `idle_timeout_minutes` (default 30 mins after last agent reply)
  #   2. The current session reaches `max_turns_per_session` (default 15 turns)
  #   3. A user types `/new` (or `/clear`) or clicks the [🔄 New Session] button
  # Reuse any old session anytime with `/session <session_id>` (resets turn count & idle timer!).
  session:
    enabled: true
    state_db_file: "./agent_state.db"
    idle_timeout_minutes: 30        # Auto-rotate to a fresh session after 30 mins of silence
    max_turns_per_session: 15       # Auto-rotate after 15 back-and-forth turns
    show_new_session_button: true   # Attach [🔄 New Session] button to replies

  # --- Optional Hard CLI Tool & Command Restrictions (Disabled by Default) ---
  # When `enabled: false` (default), CLI agents rely on the system prompt safety rules.
  # When you set `enabled: true`, the bot enforces hard CLI-level flags/permissions
  # across Cursor CLI, Claude CLI, OpenCode, Pi, and Codex to block file edits and
  # restrict shell commands strictly to `allowed_shell_commands`.
  cli_restrictions:
    enabled: false                  # <-- Set to true when you are ready to enforce hard CLI restrictions
    allow_file_edits: false         # When restrictions are enabled, block Edit/Write tools
    allowed_shell_commands:
      - "python *ops_toolkit.py*"
      - "python3 *ops_toolkit.py*"
      - "*ops_toolkit.py*"
      - "pm2 jlist*"
      - "pm2 status*"
      - "pm2 logs*"
      - "pm2 describe*"
    denied_shell_commands:
      - "pm2 restart*"
      - "pm2 reload*"
      - "pm2 stop*"
      - "pm2 delete*"
      - "pm2 kill*"
      - "*Restart-Service*"
      - "*Stop-Service*"
      - "*Stop-Process*"
      - "taskkill*"
      - "del *"
      - "rm -rf*"
      - "format *"

  # --- Mode A: CLI Subscription Configuration ---
  cli_subscription:
    # Built-in provider presets: "cursor" | "claude" | "codex" | "gemini" | "custom"
    provider: "cursor"
    # Optional model override passed to the CLI (leave empty to use CLI default,
    # or set e.g. "sonnet-4", "gpt-5", "claude-sonnet-4-20250514")
    model: ""
    timeout_seconds: 180
    max_concurrent_processes: 1     # Protects Windows Server from spawning multiple heavy CLI processes at once
    default_working_dir: "C:\\Services"
    binaries:
      cursor: "agent"               # Cursor CLI binary (`agent` or `cursor-agent` or `wsl agent`)
      claude: "claude"              # Claude Code CLI (`claude`)
      codex: "codex"                # OpenAI Codex CLI (`codex`)
      gemini: "gemini"              # Google Gemini CLI (`gemini`)
    custom_command_template: []
    # Required for PM2 / Telegram: Cursor CLI otherwise exits asking to trust the cwd.
    trust_workspace: true
    # Required for PM2 / Telegram: auto-approve shell commands (`--force` / `--yolo`).
    # Without this, Cursor waits for a y/n prompt that Telegram cannot answer.
    force_allow_commands: true
    # Live assistant/tool stream (not hidden model reasoning — Cursor print mode omits that).
    # Tail on the server: Get-Content .\logs\agent-turns.log -Wait -Tail 50
    turn_log_file: "./logs/agent-turns.log"

  # --- Mode B: SDK / API Key Configuration (OpenCode / Pi CLI Harness) ---
  sdk_apikey:
    # Harness choice for API Key mode:
    #   - "opencode": Uses OpenCode CLI (`opencode run --format json --session <id>`)
    #   - "pi":       Uses Pi coding agent (`pi -p --session <id>`)
    harness: "opencode"             # "opencode" | "pi"
    opencode_bin: "opencode"
    pi_bin: "pi"
    provider: "anthropic"           # "openai" | "anthropic" | "gemini" | "openrouter" | etc.
    model: "claude-3-5-haiku-latest"
    api_key_env: "ANTHROPIC_API_KEY"
    timeout_seconds: 180
    max_concurrent_processes: 2

# ----------------------------------------------------------------------------
# 2. TELEGRAM & TEAM RBAC (Role-Based Access Control)
# ----------------------------------------------------------------------------
telegram:
  allowed_group_ids:
    - -1001234567890

  # Admins: Can ask diagnostic questions, switch engine modes, AND click [Approve]
  #         on state-changing actions (restarting PM2/Windows services, killing hung queries).
  admins:
    - 111111111
    - 222222222

  # Viewers (Teammates): Can ask the agent to debug services, read logs/code, inspect ngrok/n8n,
  #                      and run read-only MySQL queries.
  viewers:
    - 333333333
    - 444444444

  require_mention_in_groups: false
  action_expiry_seconds: 600

# ----------------------------------------------------------------------------
# 3. INFRASTRUCTURE INTEGRATIONS (PM2, ngrok, n8n, MySQL)
# ----------------------------------------------------------------------------
integrations:
  pm2:
    enabled: true
    pm2_bin: "pm2"
    pm2_home: "C:\\Users\\Administrator\\.pm2"
    default_log_lines: 100

  ngrok:
    enabled: true
    inspector_url: "http://127.0.0.1:4040"
    win_service_name: "ngrok"
    pm2_name: "ngrok"

  n8n:
    enabled: true
    health_url: "http://127.0.0.1:5678/healthz"
    pm2_name: "n8n"
    win_service_name: ""
    working_dir: "C:\\Users\\Administrator\\.n8n"
    log_paths:
      - "C:\\Users\\Administrator\\.n8n\\logs\\*.log"

  mysql:
    enabled: true
    host: "127.0.0.1"
    port: 3306
    user: "ops_agent_ro"
    password_env: "MYSQL_PASSWORD"
    default_database: "app_production"
    allowed_databases:
      - "app_production"
      - "n8n"
      - "information_schema"
    max_rows: 50
    query_timeout_seconds: 5

# ----------------------------------------------------------------------------
# 4. MULTI-SERVICE REGISTRY (Multiple Action Logs + Source Code Directories)
# ----------------------------------------------------------------------------
services:
  order-api-py:
    description: "Main Python FastAPI backend handling customer orders, payments, and webhooks"
    runtime: "python"
    manager: "pm2"
    pm2_name: "order-api-py"
    win_service_name: ""
    process_match: "uvicorn"
    working_dir: "C:\\Services\\order-api-py"
    logs_dir: "C:\\Services\\order-api-py\\logs"
    log_files:
      app: "C:\\Services\\order-api-py\\logs\\app.log"
      payment: "C:\\Services\\order-api-py\\logs\\payment*.log"
      webhook: "C:\\Services\\order-api-py\\logs\\webhook*.log"
      auth: "C:\\Services\\order-api-py\\logs\\auth*.log"
      error: "C:\\Services\\order-api-py\\logs\\error*.log"
    log_paths:
      - "C:\\Services\\order-api-py\\logs\\*.log"
      - "C:\\Users\\Administrator\\.pm2\\logs\\order-api-py-error.log"
      - "C:\\Users\\Administrator\\.pm2\\logs\\order-api-py-out.log"
    health_url: "http://127.0.0.1:8000/health"
    port: 8000

  sync-worker-py:
    description: "Python background worker syncing jobs with MySQL and external APIs"
    runtime: "python"
    manager: "pm2"
    pm2_name: "sync-worker-py"
    working_dir: "C:\\Services\\sync-worker-py"
    logs_dir: "C:\\Services\\sync-worker-py\\logs"
    log_files:
      scheduler: "C:\\Services\\sync-worker-py\\logs\\scheduler*.log"
      mysql_sync: "C:\\Services\\sync-worker-py\\logs\\mysql_sync*.log"
      retry_queue: "C:\\Services\\sync-worker-py\\logs\\retry_queue*.log"
      error: "C:\\Services\\sync-worker-py\\logs\\error*.log"
    log_paths:
      - "C:\\Services\\sync-worker-py\\logs\\*.log"
      - "C:\\Users\\Administrator\\.pm2\\logs\\sync-worker-py-error.log"
    port: null

  billing-service-py:
    description: "Python Windows Service (NSSM) processing scheduled billing invoices"
    runtime: "python"
    manager: "windows_service"
    win_service_name: "BillingPythonService"
    process_match: "billing_worker.py"
    working_dir: "C:\\Services\\billing-service-py"
    logs_dir: "C:\\Services\\billing-service-py\\logs"
    log_files:
      invoice_gen: "C:\\Services\\billing-service-py\\logs\\invoice*.log"
      tax_sync: "C:\\Services\\billing-service-py\\logs\\tax*.log"
      error: "C:\\Services\\billing-service-py\\logs\\error*.log"
    log_paths:
      - "C:\\Services\\billing-service-py\\logs\\*.log"
    event_log_source: "BillingPythonService"
    health_url: "http://127.0.0.1:8010/health"
    port: 8010

  realtime-gateway-node:
    description: "Node.js Express/WebSocket gateway receiving external webhooks via ngrok"
    runtime: "nodejs"
    manager: "pm2"
    pm2_name: "realtime-gateway-node"
    working_dir: "C:\\Services\\realtime-gateway-node"
    logs_dir: "C:\\Services\\realtime-gateway-node\\logs"
    log_files:
      websocket: "C:\\Services\\realtime-gateway-node\\logs\\websocket*.log"
      incoming_webhook: "C:\\Services\\realtime-gateway-node\\logs\\webhook*.log"
      error: "C:\\Services\\realtime-gateway-node\\logs\\error*.log"
    log_paths:
      - "C:\\Services\\realtime-gateway-node\\logs\\*.log"
      - "C:\\Users\\Administrator\\.pm2\\logs\\realtime-gateway-node-error.log"
    health_url: "http://127.0.0.1:3001/health"
    port: 3001
